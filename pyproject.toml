[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exceptionledger"
version = "0.1.0"
description = "A tamper-evident ledger for security policy exceptions: expiry, approval and re-review when the code under an exception changes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
exceptionledger = "exceptionledger.cli:main"

[tool.setuptools.packages.find]
include = ["exceptionledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
